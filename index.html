<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靠過來探索者分部回報系統</title>
    <style>
        :root {
            --bg-color: #f7f5f2;
            --main-brown: #7a5a4a;
            --tab-inactive: #b79c8d;
            --text-dark: #7a5a4a; 
            --text-light: #ffffff;
            --input-bg: #e6e3df;
            --border-radius: 8px;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            font-size: 110%; 
        }

        .container {
            width: 100%;
            max-width: 900px; 
        }

        input, select, button {
            font-family: inherit;
        }

        ::placeholder {
            color: #a8948a;
            opacity: 0.7; 
        }

        .header {
            background-color: var(--main-brown);
            color: var(--text-light);
            text-align: center;
            padding: 20px 10px;
            border-radius: var(--border-radius);
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            border-bottom: 3px solid var(--tab-inactive);
            margin-bottom: 20px;
            flex-wrap: wrap; 
        }

        .tab-btn {
            background-color: var(--tab-inactive);
            color: var(--text-light);
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            transition: 0.3s;
            font-weight: bold;
            flex: 1; 
            text-align: center;
            min-width: 100px;
        }

        .tab-btn.active {
            background-color: var(--main-brown);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .section-title {
            background-color: var(--main-brown);
            color: var(--text-light);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 20px;
            font-size: 0.9em;
        }

        button.section-title {
            border: none;
            cursor: pointer;
            margin: 0;
            font-size: 0.9em;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap; 
        }

        .form-label {
            width: 105px; 
            font-weight: bold;
            color: var(--text-dark);
            flex-shrink: 0;
        }

        input[type="text"], input[type="password"], input[type="date"], select {
            background-color: var(--input-bg);
            border: none; 
            outline: none;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 1em;
            color: var(--text-dark);
            box-sizing: border-box;
        }
        
        .input-short { width: 90px; }
        .input-eq { width: 130px; } 
        .input-med { width: 180px; }
        .input-long { width: 100%; max-width: 400px; }

        .player-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
            flex-wrap: wrap; 
            background-color: #fdfaf6;
            padding: 10px;
            border-radius: 8px;
        }

.submit-btn {
    background-color: var(--main-brown);
    color: var(--text-light);
    border: none;
    padding: 12px 40px;
    font-size: 1.1em;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    display: block;
    margin: 30px auto 0; /* <--- 把這行改成這樣就能完美置中！ */
    width: 100%; 
    max-width: 250px; 
}

        .submit-btn:hover {
            background-color: #5c4337;
        }

        .search-box, .password-box {
            background-color: #ebe7e1;
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            text-align: center;
        }

        .dashboard-card {
            background-color: #ebe7e1;
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .badge {
            background-color: var(--tab-inactive); 
            color: white;
            padding: 8px 15px; 
            border-radius: 4px;
            font-size: 0.9em;
            margin-right: 15px;
            display: inline-block; 
            width: 140px; 
            text-align: center;
            margin-bottom: 5px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 500px; 
        }

        th {
            font-weight: bold;
            color: var(--text-dark);
            padding: 10px 12px;
            border-bottom: 2px solid var(--tab-inactive);
            text-align: left; 
            white-space: nowrap;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #d1ccc5;
            text-align: left;
            vertical-align: top; 
        }

        tbody tr {
            background-color: var(--bg-color);
            transition: all 0.3s ease;
        }

        tbody td:first-child { border-radius: 8px 0 0 8px; }
        tbody td:last-child { border-radius: 0 8px 8px 0; }

        .section-divider {
            border-top: 2px dashed #d1ccc5;
            margin: 40px 0 20px 0;
            padding-top: 30px;
        }
        
        .status-badge-sm {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            display: inline-block;
            white-space: nowrap;
        }
        .status-confirmed-sm { background-color: #d4e2d4; color: #4a7c59; }
        .status-pending-sm { background-color: #fce4d6; color: #c47b57; }
        
        .notes-text {
            background-color: #fdfaf6;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: var(--main-brown);
            border-left: 3px solid var(--tab-active);
        }

        /* 桌面版專屬的強制不換行設定 */
        .scenario-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: nowrap; /* 預設不換行 */
        }

        /* 手機版排版調整 */
        @media (max-width: 600px) {
            .form-label { width: 100%; margin-bottom: 5px; }
            .input-eq, .input-med, .input-long { width: 100%; max-width: 100%; }
            .player-row { flex-direction: column; align-items: stretch; gap: 8px; padding-bottom: 15px; border-bottom: 1px dashed #d1ccc5; }
            .player-row > span { display: none; } 
            .input-short { width: 100%; }
            
            /* 在手機版取消劇本下拉選單的強制不換行，讓它們可以撐滿寬度 */
            .scenario-wrapper {
                flex-wrap: wrap; 
                width: 100%;
            }
            .scenario-wrapper select {
                width: 100%; /* 讓選單在手機版佔滿整行 */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">靠過來探索者分部回報系統</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'tab-report')">團務回報</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-history')">本月回報紀錄</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-search')">跑團紀錄查詢</button>
    </div>

    <!-- Tab 1: 團務回報 -->
    <div id="tab-report" class="tab-content active">
        
        <div id="password-gate" class="password-box">
            <h3 style="margin-top: 0; color: var(--main-brown);">團務回報系統</h3>
            <p style="font-size: 0.85em; margin-bottom: 20px;">本區域僅限 GM 填寫，請輸入您的專屬密碼以解鎖表單</p>
            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <input type="password" id="gatePassword" class="input-med" placeholder="請輸入GM密碼" style="background-color: #ffffff;" onkeypress="if(event.key === 'Enter') verifyGMPassword()">
                <button class="section-title" onclick="verifyGMPassword()">驗證並進入</button>
            </div>
        </div>

        <div id="report-form-wrapper" style="display: none;">
            <div class="section-title">團務資訊</div>
            <div class="form-row">
                <div class="form-label">團務日期</div>
                <input type="date" id="sessionDate" style="width:100%; max-width:180px;">
            </div>
            
            <!-- 修改：劇本編號的排版 -->
            <div class="form-row">
                <div class="form-label">劇本編號</div>
                <div class="scenario-wrapper">
                    <select id="scenarioTypeSelect" class="input-eq" onchange="onScenarioTypeChange()">
                        <option value="">讀取類型中...</option>
                    </select>
                    <select id="scenarioNumSelect" class="input-eq">
                        <option value="">請先選類型</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-label">GM PFS ID</div>
                <input type="text" id="gmId" class="input-med" placeholder=" " maxlength="7" pattern="\d*">
            </div>
            <div class="form-row">
                <div class="form-label">回報註記</div>
                <input type="text" id="reportNotes" class="input-long" placeholder="例如：選項A、或積分給角色 -2">
            </div>
            
            <input type="hidden" id="verifiedPassword">

            <div class="section-title">玩家角色</div>
            <div id="players-container"></div>
            <button class="submit-btn" onclick="submitForm()">送出回報</button>
        </div>
    </div>

    <!-- Tab 2: 本月回報紀錄 -->
    <div id="tab-history" class="tab-content">
        <div class="dashboard-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>團務日期</th>
                            <th>GM PFSID</th>
                            <th>劇本編號</th>
                            <th>Paizo 回報狀態</th>
                            <th>玩家編號列表</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Tab 3: 跑團紀錄查詢 -->
    <div id="tab-search" class="tab-content">
        <div class="search-box" style="display: flex; flex-direction: column; align-items: center;">
            <div class="form-row" style="margin-bottom: 0; justify-content: center; width: 100%;">
                <div class="form-label" style="width: auto; margin-right: 10px;">請輸入您的 PFS ID</div>
                <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content: center;">
                    <input type="text" id="searchPfsId" class="input-med" placeholder="PFS ID" maxlength="7" style="background-color: #ffffff;" onkeypress="if(event.key === 'Enter') searchRecords()">
                    <button class="section-title" style="margin:0;" onclick="searchRecords()">查詢</button>
                </div>
            </div>
        </div>

        <div class="dashboard-card" id="search-results" style="display: none;">
            <h3 style="margin-top:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content: center;">
                <span>PFS ID : <span id="res-id"></span></span>
                <span id="res-milestone-tag" style="display:none; font-size:0.65em; background-color:var(--main-brown); color:white; padding:4px 10px; border-radius:12px; white-space:nowrap;"></span>
            </h3>
            <div id="stats-container" style="display: flex; flex-direction: column; gap: 15px; margin: 20px 0; align-items: center;"></div>
            <div class="section-divider">
                <div class="section-title" style="margin-top: 0;">參與紀錄</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>團務日期</th>
                                <th>GM PFSID</th>
                                <th>參團角色</th>
                                <th>劇本編號</th>
                                <th>Paizo 回報狀態</th>
                            </tr>
                        </thead>
                        <tbody id="search-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ⚠️ 記得替換這裡的 GAS_URL 網址！ ⚠️
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbygWWPFj63EttlBcM64FdOuSPZq95Qb1k_MmHDHCW6BwU4zAzboX01QtqKA5fYNViR7DA/exec"; 

    let groupedScenarios = {};

    const playersContainer = document.getElementById('players-container');
    for (let i = 1; i <= 6; i++) {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `
            <div class="form-label" style="margin-bottom:0;">玩家#0${i}</div>
            <input type="text" class="input-med" placeholder="PFS ID" maxlength="7" pattern="\\d*">
            <span>-</span>
            <input type="text" class="input-short" placeholder="角色碼 (4碼)" maxlength="4" pattern="\\d*">
        `;
        playersContainer.appendChild(row);
    }

    window.onload = function() {
        loadScenarios();
    };

    async function loadScenarios() {
        try {
            const response = await fetch(`${GAS_URL}?action=getScenarios`);
            const result = await response.json();
            const typeSelect = document.getElementById('scenarioTypeSelect');
            
            if (result.status === "success") {
                groupedScenarios = {};
                result.scenarios.forEach(scen => {
                    const firstSpaceIndex = scen.indexOf(' ');
                    if (firstSpaceIndex !== -1) {
                        const type = scen.substring(0, firstSpaceIndex).trim();
                        const num = scen.substring(firstSpaceIndex + 1).trim();
                        if (!groupedScenarios[type]) groupedScenarios[type] = [];
                        groupedScenarios[type].push(num);
                    }
                });

                typeSelect.innerHTML = '<option value="">請選擇類型...</option>';
                Object.keys(groupedScenarios).forEach(type => {
                    typeSelect.innerHTML += `<option value="${type}">${type}</option>`;
                });
                document.getElementById('scenarioNumSelect').innerHTML = '<option value="">請先選擇類型</option>';
            } else {
                typeSelect.innerHTML = '<option value="">載入失敗</option>';
            }
        } catch (error) {
            document.getElementById('scenarioTypeSelect').innerHTML = '<option value="">無法連線</option>';
        }
    }

    window.onScenarioTypeChange = function() {
        const typeSelectValue = document.getElementById('scenarioTypeSelect').value;
        const numSelect = document.getElementById('scenarioNumSelect');
        numSelect.innerHTML = '<option value="">請選擇編號...</option>';
        if (typeSelectValue && groupedScenarios[typeSelectValue]) {
            groupedScenarios[typeSelectValue].forEach(num => {
                numSelect.innerHTML += `<option value="${num}">${num}</option>`;
            });
        }
    }

    window.openTab = function(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            tabcontent[i].classList.remove("active");
        }
        tablinks = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.className += " active";

        if (tabName === 'tab-history') {
            loadMonthlyReports();
        }
    }

    window.verifyGMPassword = async function() {
        const pwd = document.getElementById('gatePassword').value.trim();
        if (!pwd) return alert('請輸入 GM 專屬密碼！');

        const btn = document.querySelector('#password-gate .section-title');
        const originalText = btn.innerText;
        btn.innerText = "驗證中...";
        btn.disabled = true;

        try {
            const response = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "verifyPassword", password: pwd })
            });
            const result = await response.json();

            if (result.status === "success") {
                document.getElementById('password-gate').style.display = 'none';
                document.getElementById('report-form-wrapper').style.display = 'block';
                document.getElementById('verifiedPassword').value = pwd;
            } else {
                alert(result.message); 
            }
        } catch (error) {
            alert("❌ 驗證失敗，請檢查網路連線。");
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    async function loadMonthlyReports() {
        const tbody = document.getElementById('history-table-body');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-dark);">資料讀取中... ⏳</td></tr>';

        try {
            const response = await fetch(`${GAS_URL}?action=getMonthlyReports`);
            const result = await response.json();

            if (result.status === "success") {
                tbody.innerHTML = "";
                if (result.reports.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">本月目前尚無回報紀錄</td></tr>';
                    return;
                }
                result.reports.forEach((report, index) => {
                    let playersHtml = '';
                    try {
                        const players = JSON.parse(report.players);
                        playersHtml = players.map(p => `
                            <div>${p.p_id} - ${p.c_id}</div>
                        `).join('');
                    } catch(e) {}

                    const statusHtml = report.status === 'Confirmed' 
                        ? '<span class="status-badge-sm status-confirmed-sm">已回報</span>'
                        : '<span class="status-badge-sm status-pending-sm">未回報</span>';
                        
                    const notesHtml = report.notes ? `<div class="notes-text">備註：${report.notes}</div>` : '';

                    const tr1 = document.createElement('tr');
                    tr1.innerHTML = `
                        <td>${report.date}</td>
                        <td>${report.gmId}</td>
                        <td>${report.scenarioCode}</td>
                        <td>${statusHtml}</td>
                        <td>
                            <div style="color: #a8948a; cursor: pointer; user-select: none;" onclick="togglePlayers('plist-${index}')" id="btn-plist-${index}">
                                點擊顯示明細 ▼
                            </div>
                        </td>
                    `;
                    
                    const tr2 = document.createElement('tr');
                    tr2.id = `plist-${index}`;
                    tr2.style.display = 'none';
                    tr2.innerHTML = `
                        <td style="border: none; padding: 0;"></td>
                        <td colspan="4" style="border: none; padding-top: 0; padding-bottom: 20px; color: var(--text-dark);">
                            ${notesHtml}
                            ${playersHtml || '無玩家資料'}
                        </td>
                    `;
                    tbody.appendChild(tr1);
                    tbody.appendChild(tr2);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">讀取失敗：${result.message}</td></tr>`;
            }
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">發生錯誤，請檢查網路連線。</td></tr>';
        }
    }

    window.togglePlayers = function(listId) {
        const listDiv = document.getElementById(listId);
        const btnText = document.getElementById('btn-' + listId);
        if (listDiv.style.display === 'none') {
            listDiv.style.display = 'table-row';
            btnText.innerText = '隱藏明細 ▲';
            btnText.style.color = 'var(--main-brown)';
        } else {
            listDiv.style.display = 'none';
            btnText.innerText = '點擊顯示明細 ▼';
            btnText.style.color = '#a8948a';
        }
    }

    window.searchRecords = async function() {
        const id = document.getElementById('searchPfsId').value.trim();
        if(!id) return alert('請輸入 PFS ID 來進行查詢喔！');
        
        if (!/^\d{1,7}$/.test(id)) {
            return alert("⚠️ PFS ID 格式錯誤！必須為 7 碼以內的純數字。");
        }

        const searchBtn = document.querySelector('#tab-search .section-title');
        const originalBtnText = searchBtn.innerText;
        searchBtn.innerText = "查詢中...";
        searchBtn.disabled = true;

        try {
            const response = await fetch(`${GAS_URL}?action=searchPlayer&id=${id}`);
            const result = await response.json();

            if (result.status === "success") {
                document.getElementById('search-results').style.display = 'block';
                document.getElementById('res-id').innerText = result.targetId;
                
                const milestoneTag = document.getElementById('res-milestone-tag');
                if (result.totalCount >= 100) {
                    milestoneTag.innerText = "達成 100 場任務";
                    milestoneTag.style.display = 'inline-block';
                } else if (result.totalCount >= 25) {
                    milestoneTag.innerText = "達成 25 場任務";
                    milestoneTag.style.display = 'inline-block';
                } else if (result.totalCount >= 10) {
                    milestoneTag.innerText = "達成 10 場任務";
                    milestoneTag.style.display = 'inline-block';
                } else {
                    milestoneTag.style.display = 'none';
                }
                
                const statsContainer = document.getElementById('stats-container');
                statsContainer.innerHTML = `
                    <div><span class="badge">累計跑團場次</span> <strong style="font-size: 1.2em;">${result.totalCount}</strong></div>
                    <div><span class="badge">累計帶團次數</span> <strong style="font-size: 1.2em;">${result.totalGM}</strong></div>
                `;

                const tbody = document.querySelector('#search-table-body');
                tbody.innerHTML = "";
                
                if (result.reports.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">目前還沒有找到您的紀錄喔！</td></tr>`;
                } else {
                    result.reports.forEach(report => {
                        const statusHtml = report.status === 'Confirmed' 
                            ? '<span class="status-badge-sm status-confirmed-sm">已回報</span>'
                            : '<span class="status-badge-sm status-pending-sm">未回報</span>';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${report.date}</td>
                            <td>${report.gmId}</td>
                            <td>${report.characterId}</td>
                            <td>${report.scenarioCode}</td>
                            <td>${statusHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } else {
                alert("❌ 查詢失敗：" + result.message);
            }
        } catch (error) {
            alert("❌ 發生錯誤，請檢查網路連線或稍後再試。");
        } finally {
            searchBtn.innerText = originalBtnText;
            searchBtn.disabled = false;
        }
    }

    window.submitForm = async function() {
        const sessionDate = document.getElementById('sessionDate').value;
        const typeSelect = document.getElementById('scenarioTypeSelect').value;
        const numSelect = document.getElementById('scenarioNumSelect').value;
        const gmId = document.getElementById('gmId').value.trim(); 
        const gmPassword = document.getElementById('verifiedPassword').value; 
        const notes = document.getElementById('reportNotes').value.trim();

        if (!sessionDate || !gmId || !typeSelect || !numSelect) {
            return alert("⚠️ 請確實填寫「團務日期」、「劇本類型/編號」與「GM PFS ID」喔！");
        }
        
        if (!/^\d{1,7}$/.test(gmId)) {
            return alert("⚠️ GM PFS ID 格式錯誤！必須為 7 碼以內的純數字。");
        }

        const fullScenarioCode = typeSelect + " " + numSelect;
        const players = [];
        const playerRows = document.querySelectorAll('.player-row');
        
        let isValid = true;
        let errMsg = "";

        playerRows.forEach((row, index) => {
            const inputs = row.querySelectorAll('input[type="text"]');
            const playerId = inputs[0].value.trim();
            const charCode = inputs[1].value.trim();

            if (playerId) {
                if (!/^\d{1,7}$/.test(playerId)) {
                    isValid = false;
                    errMsg = `⚠️ 玩家#0${index+1} 的 PFS ID 格式錯誤！必須為 7 碼以內的純數字。`;
                }
                if (!/^\d{1,4}$/.test(charCode)) {
                    isValid = false;
                    errMsg = `⚠️ 玩家#0${index+1} 的角色碼格式錯誤！必須為 4 碼以內的純數字。`;
                }
                players.push({ p_id: playerId, c_id: charCode });
            }
        });

        if (!isValid) { return alert(errMsg); }

        const formData = {
            action: "submitReport",
            sessionDate: sessionDate,
            scenarioCode: fullScenarioCode, 
            scenarioName: "", 
            gmId: gmId,
            password: gmPassword, 
            players: players,
            notes: notes
        };

        const submitBtn = document.querySelector('.submit-btn');
        const originalBtnText = submitBtn.innerText;
        submitBtn.innerText = "資料傳送中...";
        submitBtn.disabled = true;

        try {
            const response = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (result.status === "success") {
                alert("🎉 團務回報成功！資料已成功寫入。\n您可以繼續填寫下一筆回報。");
                
                document.getElementById('sessionDate').value = '';
                document.getElementById('scenarioTypeSelect').value = '';
                document.getElementById('scenarioNumSelect').innerHTML = '<option value="">請先選擇類型</option>';
                document.getElementById('reportNotes').value = ''; 
                
                const playerRows = document.querySelectorAll('.player-row');
                playerRows.forEach(row => {
                    const inputs = row.querySelectorAll('input[type="text"]');
                    inputs[0].value = '';
                    inputs[1].value = '';
                });
            } else {
                alert("❌ 回報失敗：" + result.message);
            }
        } catch (error) {
            alert("❌ 發生錯誤，請檢查網路連線或稍後再試。");
        } finally {
            submitBtn.innerText = originalBtnText;
            submitBtn.disabled = false;
        }
    }
</script>
</body>
</html>
