<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靠過來探索者分部回報系統 (後台)</title>
    <style>
        :root {
            --bg-color: #f7f5f2;
            --main-brown: #7a5a4a; 
            --tab-active: #c49a7c; 
            --tab-inactive: #8b6b5d; 
            --text-dark: #6a5344;
            --text-light: #ffffff;
            --box-bg: #ece9e4; 
            --border-radius: 8px;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            font-size: 110%; 
        }

        .container {
            width: 100%;
            max-width: 1000px; 
        }

        .header {
            background-color: var(--main-brown);
            color: var(--text-light);
            text-align: center;
            padding: 20px 10px;
            border-radius: var(--border-radius);
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .password-box {
            background-color: var(--box-bg);
            padding: 30px;
            text-align: center;
            border-radius: var(--border-radius);
            margin-top: 50px;
        }

        .input-med {
            padding: 10px 12px;
            border-radius: 4px;
            border: 1px solid #dcd7d1;
            font-size: 1em;
            width: 100%;
            max-width: 200px;
        }
        
        .input-eq {
            padding: 10px 12px;
            border-radius: 4px;
            border: 1px solid #dcd7d1;
            font-size: 1em;
            width: 130px;
            background-color: var(--input-bg);
            color: var(--text-dark);
        }

        .submit-btn {
            background-color: var(--main-brown);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stats-grid-annual {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        .stats-grid-annual-bottom {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background-color: var(--box-bg);
            padding: 20px 10px;
            text-align: center;
            border-radius: var(--border-radius);
        }

        .stat-title {
            font-size: 0.95em;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .stat-num {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--main-brown);
        }

        .table-section {
            margin-bottom: 50px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .main-tabs {
            display: flex;
            gap: 5px;
            border-bottom: 3px solid var(--tab-inactive);
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .main-tab-btn {
            background-color: var(--tab-inactive);
            color: var(--text-light);
            border: none;
            padding: 12px 20px;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            transition: 0.3s;
            font-weight: bold;
            flex: 1;
            text-align: center;
            min-width: 100px;
        }

        .main-tab-btn.active { background-color: var(--main-brown); }
        .main-tab-content { display: none; animation: fadeIn 0.5s; }
        .main-tab-content.active { display: block; }

        .sub-tabs {
            display: flex;
            align-items: flex-end;
            border-bottom: 4px solid var(--tab-active); 
            flex-wrap: wrap;
        }

        .sub-tab-btn {
            background-color: var(--tab-inactive);
            color: var(--text-light);
            border: none;
            padding: 10px 15px;
            font-size: 0.95em;
            cursor: pointer;
            border-radius: 12px 12px 0 0;
            transition: 0.3s;
            font-weight: bold;
            margin-right: 5px;
            margin-top: 5px;
            flex: 1;
            text-align: center;
            min-width: 120px;
        }

        .sub-tab-btn.active { background-color: var(--tab-active); }
        .sub-tab-content { display: none; animation: fadeIn 0.3s; }
        .sub-tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
            background-color: #ffffff;
            border-radius: 0 0 8px 8px;
            min-width: 600px; 
        }

        th {
            font-weight: bold;
            color: var(--text-dark);
            padding: 10px 15px;
            border-bottom: 2px solid var(--main-brown);
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 15px 15px;
            border-bottom: 1px solid #dcd7d1; 
            text-align: left;
            vertical-align: top;
        }

        tbody tr { transition: all 0.3s ease; }

        .status-badge {
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            display: inline-block;
            text-align: center;
            white-space: nowrap;
        }

        .status-confirmed { background-color: #d4e2d4; color: #4a7c59; }
        .status-pending { background-color: #fce4d6; color: #c47b57; margin-bottom: 8px; }

        .action-btn {
            background-color: var(--main-brown);
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: 0.2s;
            display: block;
            white-space: nowrap;
        }

        .action-btn:hover { background-color: #5c4337; }
        .action-btn:active { transform: scale(0.95); }
        .loading-text { text-align: center; font-weight: bold; color: var(--main-brown); padding: 40px; }
        
        .section-header {
            color: var(--main-brown);
            border-bottom: 2px dashed #c49a7c;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .notes-text {
            background-color: #fdfaf6;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: var(--main-brown);
            border-left: 3px solid var(--tab-active);
        }

        @media (max-width: 768px) {
            .stats-grid-annual { grid-template-columns: 1fr 1fr; }
            .stats-grid, .stats-grid-annual-bottom { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .stats-grid-annual, .stats-grid, .stats-grid-annual-bottom { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">靠過來探索者分部回報系統 (後台)</div>

    <div id="password-gate" class="password-box">
        <h3 style="margin-top: 0; color: var(--main-brown);">系統管理後台</h3>
        <p style="font-size: 0.9em; margin-bottom: 20px;">請輸入管理員密碼以載入系統資料</p>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px;">
            <input type="password" id="gatePassword" class="input-med" placeholder="請輸入密碼" onkeypress="if(event.key === 'Enter') verifyAdmin()">
            <button class="submit-btn" id="login-btn" onclick="verifyAdmin()">登入後台</button>
        </div>
    </div>

    <div id="admin-dashboard" style="display: none;">
        
        <input type="hidden" id="verifiedPassword">

        <div class="main-tabs">
            <button class="main-tab-btn active" onclick="openMainTab(event, 'main-management')">團務審核</button>
            <button class="main-tab-btn" onclick="openMainTab(event, 'main-annual')">年度報表</button>
        </div>

        <div id="main-management" class="main-tab-content active">
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-title">本月PFS總人次</div><div class="stat-num" id="stat-people">0</div></div>
                <div class="stat-box"><div class="stat-title">本月PFS總團數</div><div class="stat-num" id="stat-sessions">0</div></div>
            </div>

            <div class="table-section">
                <div class="sub-tabs">
                    <button class="sub-tab-btn active" onclick="openSubTab(event, 'report-this-month', 'report-tab')">本月團務紀錄</button>
                    <button class="sub-tab-btn" onclick="openSubTab(event, 'report-last-month', 'report-tab')">上月團務紀錄</button>
                </div>
                
                <div id="report-this-month" class="sub-tab-content active report-tab">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>團務日期</th>
                                    <th>GM PFSID</th>
                                    <th>劇本編號</th>
                                    <th>狀態</th>
                                    <th>玩家編號列表</th>
                                </tr>
                            </thead>
                            <tbody id="report-this-body">
                                <tr><td colspan="5" class="loading-text">資料讀取中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="report-last-month" class="sub-tab-content report-tab">
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>團務日期</th><th>GM PFSID</th><th>劇本編號</th><th>狀態</th><th>玩家編號列表</th></tr></thead>
                            <tbody id="report-last-body">
                                <tr><td colspan="5" class="loading-text">資料讀取中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div id="main-annual" class="main-tab-content">
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #c49a7c; padding-bottom: 10px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h2 style="color: var(--main-brown); margin: 0; font-size: 1.2em;">Paizo 官方回報數據</h2>
                <select id="reportYearSelect" class="input-eq" style="font-weight: bold; font-size: 1.05em; background-color: white;" onchange="updateAnnualView()">
                </select>
            </div>
            
            <div class="table-section">
                <div class="sub-tabs">
                    <button class="sub-tab-btn active" onclick="openSubTab(event, 'annual-stats-view', 'annual-tab')">年度統計</button>
                    <button class="sub-tab-btn" onclick="openSubTab(event, 'monthly-stats-view', 'annual-tab')">每月統計</button>
                </div>
                
                <div id="annual-stats-view" class="sub-tab-content active annual-tab">
                    <div style="background-color: #ffffff; padding: 20px; border-radius: 0 0 8px 8px;">
                        <div class="stats-grid-annual">
                            <div class="stat-box">
                                <div class="stat-title">年度 Scenarios 總數</div>
                                <div class="stat-num" id="annual-scenarios">0</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-title">年度 Quests & Bounties</div>
                                <div class="stat-num" id="annual-qb">0</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-title">年度其他劇本總數</div>
                                <div class="stat-num" id="annual-others">0</div>
                            </div>
                        </div>
                        <div class="stats-grid-annual-bottom">
                            <div class="stat-box">
                                <div class="stat-title">帶團 GM 總人數</div>
                                <div class="stat-num" id="annual-gms">0</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-title">參與玩家總人數</div>
                                <div class="stat-num" id="annual-players">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="monthly-stats-view" class="sub-tab-content annual-tab">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>月份</th>
                                    <th>Scenarios</th>
                                    <th>Quests / Bounties</th>
                                    <th>其他劇本</th>
                                    <th>出勤 GM 數</th>
                                    <th>參與玩家數</th>
                                </tr>
                            </thead>
                            <tbody id="monthly-stats-body">
                                <tr><td colspan="6" class="loading-text">資料讀取中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbygWWPFj63EttlBcM64FdOuSPZq95Qb1k_MmHDHCW6BwU4zAzboX01QtqKA5fYNViR7DA/exec"; // 請替換為您的正式網址

    window.allReportsData = [];

    function openMainTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("main-tab-content");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            tabcontent[i].classList.remove("active");
        }
        tablinks = document.getElementsByClassName("main-tab-btn");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.className += " active";
    }

    function openSubTab(evt, tabName, tabGroupClass) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName(tabGroupClass);
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            tabcontent[i].classList.remove("active");
        }
        var parentTabs = evt.currentTarget.parentElement;
        tablinks = parentTabs.getElementsByClassName("sub-tab-btn");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.className += " active";
    }

    async function verifyAdmin() {
        const pwd = document.getElementById('gatePassword').value.trim();
        if (!pwd) return alert('請輸入密碼！');

        const btn = document.getElementById('login-btn');
        btn.innerText = "驗證中...";
        btn.disabled = true;

        try {
            const response = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "verifyPassword", password: pwd })
            });
            const result = await response.json();

            if (result.status === "success") {
                document.getElementById('password-gate').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                document.getElementById('verifiedPassword').value = pwd;
                
                loadAllDashboardData();
            } else {
                alert("密碼錯誤！");
                btn.innerText = "登入後台";
                btn.disabled = false;
            }
        } catch (error) {
            alert("連線失敗，請檢查網路。");
            btn.innerText = "登入後台";
            btn.disabled = false;
        }
    }

    async function loadAllDashboardData() {
        try {
            const response = await fetch(`${GAS_URL}?action=getAllReports`);
            const result = await response.json();

            if (result.status === "success") {
                window.allReportsData = result.data;
                populateYearSelect();
                renderManagementAndRewards();
                updateAnnualView();
            } else {
                alert("讀取資料失敗：" + result.message);
            }
        } catch (error) {
            alert("讀取資料發生錯誤，請檢查網路。");
        }
    }

    function renderManagementAndRewards() {
        const rows = window.allReportsData;
        const today = new Date();
        const curM = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, '0');
        const lmDate = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        const lastM = lmDate.getFullYear() + "-" + String(lmDate.getMonth() + 1).padStart(2, '0');

        let stats = { people: 0, sessions: 0 };
        let reportHtmlCur = "";
        let reportHtmlLast = "";

        for (let i = rows.length - 1; i >= 1; i--) {
            const row = rows[i];
            const rId = row[0];
            const rawDate = new Date(row[1]);
            if (isNaN(rawDate.getTime())) continue;

            const rDateStr = rawDate.getFullYear() + "." + String(rawDate.getMonth() + 1).padStart(2, '0') + "." + String(rawDate.getDate()).padStart(2, '0');
            const rMonthStr = rawDate.getFullYear() + "-" + String(rawDate.getMonth() + 1).padStart(2, '0');
            const rCode = row[2];
            const gmId = String(row[4]).trim();
            
            let players = [];
            try { players = JSON.parse(row[5]); } catch(e){}
            const status = row[7];
            const notes = row[9] ? String(row[9]) : ""; 

            let playersHtml = players.map(p => `<div>${p.p_id} - ${p.c_id}</div>`).join('');
            if(!playersHtml) playersHtml = "無玩家資料";

            let notesHtml = notes ? `<div class="notes-text">備註：${notes}</div>` : "";

            let statusHtml = "";
            if (status === "Confirmed") {
                statusHtml = `<div class="status-badge status-confirmed">已回報</div>`;
            } else {
                statusHtml = `
                    <div class="status-badge status-pending">待回報</div>
                    <button class="action-btn" onclick="confirmReport('${rId}')">確認回報</button>
                `;
            }

            const tr1 = `
                <tr>
                    <td>${rDateStr}</td>
                    <td>${gmId}</td>
                    <td>${rCode}</td>
                    <td id="status-cell-${rId}">${statusHtml}</td>
                    <td>
                        <div style="color: #a8948a; cursor: pointer; user-select: none;" onclick="togglePlayers('plist-${rId}')" id="btn-plist-${rId}">展開 ▼</div>
                    </td>
                </tr>
            `;
            const tr2 = `
                <tr id="plist-${rId}" style="display: none;">
                    <td style="border: none; padding: 0;"></td>
                    <td colspan="4" style="border: none; padding-top: 0; padding-bottom: 20px; color: var(--text-dark);">
                        ${notesHtml}
                        ${playersHtml}
                    </td>
                </tr>
            `;

            if (rMonthStr === curM) {
                reportHtmlCur += (tr1 + tr2);
                stats.sessions++;
                stats.people += players.length;
            } 
            else if (rMonthStr === lastM) {
                reportHtmlLast += (tr1 + tr2);
            }
        }

        document.getElementById('report-this-body').innerHTML = reportHtmlCur || '<tr><td colspan="5" style="text-align: center;">無本月資料</td></tr>';
        document.getElementById('report-last-body').innerHTML = reportHtmlLast || '<tr><td colspan="5" style="text-align: center;">無上月資料</td></tr>';

        document.getElementById('stat-people').innerText = stats.people;
        document.getElementById('stat-sessions').innerText = stats.sessions;
    }

    function populateYearSelect() {
        let years = new Set();
        for(let i = 1; i < window.allReportsData.length; i++) {
            let date = new Date(window.allReportsData[i][1]);
            if(!isNaN(date.getTime())) years.add(date.getFullYear());
        }
        let yearArr = Array.from(years).sort((a,b) => b - a); 
        if(yearArr.length === 0) yearArr = [new Date().getFullYear()]; 
        
        let select = document.getElementById('reportYearSelect');
        select.innerHTML = yearArr.map(y => `<option value="${y}">${y} 年</option>`).join('');
    }

    window.updateAnnualView = function() {
        const year = parseInt(document.getElementById('reportYearSelect').value);
        if(!year) return;

        let annualStats = { scenario: 0, questBounty: 0, others: 0, gms: new Set(), players: new Set() };
        let monthlyStats = {};
        for(let i=1; i<=12; i++) {
            monthlyStats[i] = { scenario: 0, questBounty: 0, others: 0, gms: new Set(), players: new Set() };
        }

        for (let i = 1; i < window.allReportsData.length; i++) {
            const row = window.allReportsData[i];
            const rawDate = new Date(row[1]);
            if (isNaN(rawDate.getTime()) || rawDate.getFullYear() !== year) continue;

            const month = rawDate.getMonth() + 1;
            const code = row[2] ? String(row[2]).toLowerCase() : "";
            const gmId = String(row[4]).trim();
            
            let players = [];
            try { players = JSON.parse(row[5]); } catch(e){}

            let isScenario = code.includes("scenario");
            let isQuestBounty = code.includes("quest") || code.includes("bounty");

            if(isScenario) { annualStats.scenario++; monthlyStats[month].scenario++; }
            else if(isQuestBounty) { annualStats.questBounty++; monthlyStats[month].questBounty++; }
            else { annualStats.others++; monthlyStats[month].others++; }

            if (gmId) {
                annualStats.gms.add(gmId);
                monthlyStats[month].gms.add(gmId);
            }

            players.forEach(p => {
                const pid = String(p.p_id).trim();
                if(pid) {
                    annualStats.players.add(pid);
                    monthlyStats[month].players.add(pid);
                }
            });
        }

        document.getElementById('annual-scenarios').innerText = annualStats.scenario;
        document.getElementById('annual-qb').innerText = annualStats.questBounty;
        document.getElementById('annual-others').innerText = annualStats.others;
        document.getElementById('annual-gms').innerText = annualStats.gms.size;
        document.getElementById('annual-players').innerText = annualStats.players.size;

        let monthlyHtml = "";
        for(let m = 12; m >= 1; m--) {
            let ms = monthlyStats[m];
            if(ms.scenario > 0 || ms.questBounty > 0 || ms.others > 0) { 
                monthlyHtml += `
                    <tr>
                        <td><strong>${m} 月</strong></td>
                        <td>${ms.scenario}</td>
                        <td>${ms.questBounty}</td>
                        <td>${ms.others}</td>
                        <td>${ms.gms.size}</td>
                        <td>${ms.players.size}</td>
                    </tr>
                `;
            }
        }
        document.getElementById('monthly-stats-body').innerHTML = monthlyHtml || '<tr><td colspan="6" style="text-align:center;">該年度尚無資料</td></tr>';
    }

    window.togglePlayers = function(listId) {
        const listDiv = document.getElementById(listId);
        const btnText = document.getElementById('btn-' + listId);
        if (listDiv.style.display === 'none') {
            listDiv.style.display = 'table-row';
            btnText.innerText = '隱藏 ▲';
            btnText.style.color = 'var(--main-brown)';
        } else {
            listDiv.style.display = 'none';
            btnText.innerText = '展開 ▼';
            btnText.style.color = '#a8948a';
        }
    }

    window.confirmReport = async function(reportId) {
        if (!confirm("確定要將此團務標記為「已回報」嗎？")) return;

        const pwd = document.getElementById('verifiedPassword').value;
        const cell = document.getElementById(`status-cell-${reportId}`);
        cell.innerHTML = '<span style="font-size:0.85em; color:var(--main-brown);">處理中...</span>';

        try {
            const response = await fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "confirmReport", reportId: reportId, password: pwd })
            });

            const result = await response.json();

            if (result.status === "success") {
                cell.innerHTML = `<div class="status-badge status-confirmed">已回報</div>`;
                const reportRow = window.allReportsData.find(r => r[0] === reportId);
                if (reportRow) reportRow[7] = "Confirmed";
            } else {
                alert("更新失敗：" + result.message);
                loadAllDashboardData(); 
            }
        } catch (error) {
            alert("連線發生錯誤！");
            loadAllDashboardData(); 
        }
    }
</script>
</body>
</html>
